#####################################################################
##                  Extruder motor
#####################################################################

[extruder]
step_pin: T0:gpio18
dir_pin: T0:gpio19
enable_pin: !T0:gpio17
microsteps: 16
rotation_distance: 42.92
gear_ratio: 9:1
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: T0:gpio7
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: T0:gpio27
control: pid
pid_Kp: 23.044
pid_Ki: 2.227
pid_Kd: 59.626
min_temp: -50
max_temp: 300
max_extrude_cross_section: 5


[tmc2209 extruder]
uart_pin: T0:gpio20
run_current: 0.6
hold_current: 0.2
#run_current: 0.6  #Stock
stealthchop_threshold: 999999
