        SET_LED LED=HBB_LED RED=0.2 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0  # Extrude
        SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0    # Stop
        SET_LED LED=HBB_LED RED=1 GREEN=1 BLUE=0 INDEX=3 TRANSMIT=0    # Pause Resume
        SET_LED LED=HBB_LED RED=0 GREEN=1 BLUE=0.2157 INDEX=4 TRANSMIT=0  # Home
        SET_LED LED=HBB_LED RED=0.4039 GREEN=0.1294 BLUE=1 INDEX=5 TRANSMIT=0  # ZNozzle_UP
        SET_LED LED=HBB_LED RED=1 GREEN=1 BLUE=1 INDEX=6 TRANSMIT=0    # Led light
        SET_LED LED=HBB_LED RED=1 GREEN=0.1647 BLUE=0 INDEX=7 TRANSMIT=1  # Preheat bed

