[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

  #________________________________________________________________________________

   
[gcode_macro PRINT_COOLING]
gcode:
   M190 S60  ;Set bed temperature and wait
  _WAIT TIME=1800  ;Wait x seconds
  TURN_OFF_HEATERS  ;Turn off heaters
  _WAIT TIME=1800  ;Wait x seconds
  Nevermore_off  ;Turn off Nevermore
  _DISPLAYTEXT  ;Cooling complite


[gcode_macro M190]
rename_existing: M190.1
gcode:
  {% if printer["gcode_macro status_heating"] != null %}
    status_heating
  {% endif %}
    M190.1 { rawparams }
  {% if printer["gcode_macro status_ready"] != null %}
    status_ready
  {% endif %}

[gcode_macro _WAIT]
gcode:
    {% set TIME = params.TIME|default(0)|int %}
    G4 P{TIME*1000}


[gcode_macro DISPLAYTEXT]
gcode:
    {% set TEXT = params.TEXT|default("")|string %} #remove the .gcode from the file name for displaying from the Print_End Macro 
    RESPOND MSG="{TEXT}"
    M117 {TEXT}


