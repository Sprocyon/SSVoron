[gcode_macro G32]
gcode:
    #STATUS_HEATING
    BED_MESH_CLEAR               # Unloading net beds
    CHECK_AND_HEAT_BED
    FAST_QGL
    #G28 Z                         # Homing all axes
    



[gcode_macro PRINT_START]
#Orca start G code:
# M117
# M190 S0
# M109 S0
# PRINT_START EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]
gcode:
  # LED_ON
  {% set BED = params.BED_TEMP|int %}
  {% set EXTRUDER = params.EXTRUDER_TEMP|int %}
  M190 S{BED}  ;Set bed temperature and wait (Petg-85)
  _CHOME  ;Home all axes if not homed
  CLEAR_PAUSE
  M109 S150  ;Set extruder temperature and wait
  # _CQGL  ;Quad Gantry Level if not done
  QUAD_GANTRY_LEVEL
  G28 Z
  #SKEW_PROFILE LOAD=calilantern_skew_profile  #Skew correctionSKEW_PROFILE LOAD=calilantern_skew_profile  #Skew correction
  BED_MESH_CLEAR  ;Clear Bed Mesh
  BED_MESH_CALIBRATE ADAPTIVE=1
  G0 X175 Y175 Z60 F3600 
  M109 S{EXTRUDER}  ;Set extruder temperature and wait
  M190 S{BED}  ;Set bed temperature and wait
  
  _PURGE_LINE
  #_ADAPTIVE_PURGE  ;Adaptive Purge

[gcode_macro M190]
rename_existing: M190.1
gcode:
  {% if printer["gcode_macro status_heating"] != null %}
    status_heating
  {% endif %}
    M190.1 { rawparams }
  {% if printer["gcode_macro status_ready"] != null %}
    status_ready
  {% endif %}


[gcode_macro _CHOME]
gcode:
  {% if printer["gcode_macro status_homing"] != null %}
    status_homing
  {% endif %}
  {% if printer.toolhead.homed_axes != "xyz" %}
  G28
  {% endif %}
  {% if printer["gcode_macro status_ready"] != null %}
    status_ready
  {% endif %}

[gcode_macro M109]
rename_existing: M109.1
gcode:
  {% if printer["gcode_macro status_heating"] != null %}
    status_heating
  {% endif %}
    M109.1 { rawparams }
  {% if printer["gcode_macro status_ready"] != null %}
    status_ready
  {% endif %}




#-------------------------------------------------------------
[gcode_macro _PURGE_LINE]
gcode:
  {% if printer["gcode_macro status_cleaning"] != null %}
    status_cleaning
  {% endif %}
  SAVE_GCODE_STATE NAME=Pre_Prime
        
  G90
  G92 E0 ;Reset Extruder

  G1 Z10.0 F3000 ;Move Z Axis up
  G1 X150 Y0;
  G1 E10.0 F1800
  G1 Z0.35 F5000.0 ;Move to start position
  G1 X190 Y0 Z0.35 F800.0 E40 ;Draw the first line
  G92 E0 ;Reset Extruder
  G1 Z10 F3000 ;Move Z Axis up
  RESTORE_GCODE_STATE NAME=Pre_Prime

  {% if printer["gcode_macro status_printing"] != null %}
    status_printing
  {% endif %}
