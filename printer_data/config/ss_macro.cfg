#________________________________________________________________________________________________________________
[gcode_macro CG28]
# ; Macro for checking the status of all axes and generating a G28 command for those axes that are not yet home
gcode:
     {% set home_axes = "" %}
    {% if "x" not in printer.toolhead.homed_axes and "y" not in printer.toolhead.homed_axes %}
         {% set home_axes = home_axes + "X Y" %}
     {% elif "x" not in printer.toolhead.homed_axes %}
         {% set home_axes = home_axes + "X" %}
     {% elif "y" not in printer.toolhead.homed_axes %}
         {% set home_axes = home_axes + "Y" %}
     {% endif %}
     {% if "z" not in printer.toolhead.homed_axes %}
         {% set home_axes = home_axes + " Z" %}
     {% endif %}
     {% if home_axes != "" %}
         G28 {home_axes}
     {% endif %}
#____________________________________________________________________________
[gcode_macro G32]
gcode:
    #STATUS_HEATING
    BED_MESH_CLEAR               # Unloading net beds
    FAST_QGL
    # G28                          # Homing all axes
    # QUAD_GANTRY_LEVEL            # Gantry levelling
    G28 Z                         # Homing all axes
    #G0 X175 Y175 Z50 F3600         # 350mm
#_______________________________________________________________________________
[gcode_macro HOME_WITH_LIFT]
gcode:
    G91  # Relative positioning mode
    G0 Z20  # Move Z axis up by 20 mm
    G90  # Return to absolute positioning mode
    G28  # Home all axes

#______________________________________________________________________________
[gcode_macro FAST_QGL]
gcode:
    # _CG28: Перевірка статусу всіх вісей і генерація команди G28 для тих вісей, які ще не знаходяться в домів
    CG28

    # QUAD_GANTRY_LEVEL для виправлення виравнювання гантріїв з параметрами
    QUAD_GANTRY_LEVEL horizontal_move_z=10 retries=4 retry_tolerance=1

    # Повторне виравнювання гантріїв без додаткових параметрів
    QUAD_GANTRY_LEVEL horizontal_move_z=10

    G28 Z  # Нулювання осі Z

#_________________________________________________________________
[gcode_macro CHECK_QGL]
gcode:
    STATUS_HOMING

    
    # 1 ----- HOMING ------------------------------------------
    # Home if not already homed and park the head near the center front
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # 4 ----- QUAD GANTRY LEVELING -----------------------------
    {% if printer.quad_gantry_level.applied|lower == 'false' %}
        {% if V %}
            RESPOND MSG="QGL..."
        {% endif %}
        QUAD_GANTRY_LEVEL
    {% endif %}

#_________________________________________________________________
[gcode_macro CHECK_AND_HEAT_BED]
gcode:
    # Зчитування поточної температури столу
    {% set bed_temp = printer.heater_bed.temperature %}
    
    # Перевірка, чи температура столу менша за 60 градусів
    {% if bed_temp < 60 %}
        M117 Нагрівання столу до 60 градусів
        M140 S60  # Встановлення температури столу на 60 градусів
        M190 S60  # Очікування до досягнення температури 60 градусів
    {% else %}
        M117 Температура столу вже 60 градусів або вище
    {% endif %}
#_______________________________________________________________________________
[gcode_macro CHECK_AND_HEAT_NOZZLE]
gcode:
    # Зчитування поточної температури сопла
    {% set nozzle_temp = printer.extruder.temperature %}
    
    # Перевірка, чи температура сопла менша за 130 градусів
    {% if nozzle_temp < 130 %}
        M117 Нагрівання сопла до 130 градусів
        M104 S130  # Встановлення температури сопла на 130 градусів
        M109 S130  # Очікування до досягнення температури 130 градусів
    {% else %}
        M117 Температура сопла вже 130 градусів або вище
    {% endif %}
#______________________________________________________________________________
#____________________________________________________________________________
[gcode_macro PRINT_START] 
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode:
    BED_MESH_CLEAR                 # Unloading net beds
    BED_MESH_PROFILE LOAD=default     # Loading the net bed
    SKEW_PROFILE LOAD=calilantern_skew_profile  #Skew correction
    M109 S{ printer.extruder.target } ##Restore print head temperature
    G90                               #Absolute Positioning
    G92 E0                            # Reset Extruder
    G1 Z2.0 F3000                     # Move Z Axis up
    G1 X10.1 Y20 Z0.28 F5000.0        # Move to start position
    G1 X10.1 Y200.0 Z0.28 F1500.0 E17 # Draw the first line
    G1 X10.4 Y200.0 Z0.28 F5000.0     # Move to side a little
    G1 X10.4 Y20 Z0.28 F1500.0 E32    # Draw the second line
    G92 E0                            # Reset Extruder
    G90
