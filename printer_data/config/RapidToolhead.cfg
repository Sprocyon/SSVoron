#####################################################################
#  SSVoron — голова RapidToolhead + щуп Klicky
#
#  Тут усе, що стосується інструментальної голови:
#    * CAN-MCU голови (T1), екструдер, термістор, ADXL345, RGB
#    * щуп Klicky: змінні, стикування / док, хомінг Z
#    * безконтактний (sensorless) хомінг X/Y і homing_override
#    * обгортки QUAD_GANTRY_LEVEL / PROBE_CALIBRATE / PROBE_ACCURACY
#
#  Док щупа — на задній стінці: X67 Y344.
#  Стіл рівний, bed_mesh не використовується (див. printer.cfg).
#####################################################################

#####################################################################
#  MCU голови (RP2040, CAN)
#####################################################################
[mcu T1]
canbus_uuid: d446594edc03

[temperature_sensor T1]
sensor_type: Generic 3950
sensor_pin: T1:gpio28

#####################################################################
#  Акселерометр ADXL345 (шейпер, Shake&Tune)
#####################################################################
[adxl345]
cs_pin: T1:gpio1
spi_speed: 5000000
rate: 1600
spi_software_sclk_pin: T1:gpio2
spi_software_mosi_pin: T1:gpio0
spi_software_miso_pin: T1:gpio3
axes_map: z, -y, x

#####################################################################
#  Екструдер і хотенд
#####################################################################
[extruder]
step_pin: T1:gpio18
dir_pin: T1:gpio19
enable_pin: !T1:gpio17
microsteps: 8
rotation_distance: 47.212
gear_ratio: 9:1
full_steps_per_rotation: 200
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: T1:gpio7
sensor_type: PT1000
pullup_resistor: 4700
sensor_pin: T1:gpio27
min_temp: 0
max_temp: 300
max_extrude_cross_section: 5
instantaneous_corner_velocity: 1.5
max_extrude_only_distance: 101

[tmc2209 extruder]
uart_pin: T1:gpio20
run_current: 0.70
sense_resistor: 0.11

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg-9T
tuning_goal: performance

#####################################################################
#  RGB голови (10 діодів, логотип = INDEX 1)
#####################################################################
[neopixel Toolhead1_rgb]
pin: T1:gpio16
chain_count: 10
color_order: GRB
initial_RED: 0.2
initial_GREEN: 0.2
initial_BLUE: 0.2

#####################################################################
#  Щуп Klicky (Z-ендстоп = probe:z_virtual_endstop)
#  z_offset зберігається у SAVE_CONFIG (кінець printer.cfg)
#####################################################################
[probe]
pin: T1:gpio24
x_offset: 0
y_offset: 19.75
speed: 4.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3

#####################################################################
#  Вентилятори голови
#####################################################################
[fan]
pin: T1:gpio13
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.5
off_below: 0.2

[heater_fan hotend_fan]
pin: T1:gpio14
heater: extruder
heater_temp: 50.0

#####################################################################
#
#                          K L I C K Y
#
#  Макроси стикування/дока щупа, хомінгу Z і обгортки калібрування.
#  Оригінал: https://github.com/jlas1/Klicky-Probe
#
#####################################################################

#####################################################################
#  Змінні Klicky (налаштування механіки)
#####################################################################
[gcode_macro _User_Variables]
variable_verbose:              True    # докладні повідомлення в консоль
variable_travel_speed:          200    # мм/с — переїзди в макросах Klicky
variable_move_accel:           1000    # мм/с² — прискорення під час стикування
variable_dock_speed:             50    # мм/с — фінальний рух у док
variable_release_speed:          50    # мм/с — рух відриву від магнітів дока
variable_z_drop_speed:           15    # мм/с — опускання Z до дока

variable_safe_z:                 25    # мінімальна безпечна Z для стикування/дока
variable_enable_z_hop:         True    # True: піднімати голову, якщо Z не відхомовано

variable_max_bed_x:             355    # межі столу — захист PROBE_ACCURACY/CALIBRATE
variable_max_bed_y:             350

# Окремого Z-ендстопа немає (Z = щуп), тому 0/0:
# тоді Z хоміниться в центрі столу з урахуванням зсуву щупа.
variable_z_endstop_x:             0
variable_z_endstop_y:             0

# Док (пасивний, на магнітах)
variable_docklocation_x:         67    # X дока
variable_docklocation_y:        344    # Y дока
variable_docklocation_z:       -128    # -128 = док на рамі, без руху по Z

# Рух відриву від дока (відносний)
variable_dockmove_x:            -60
variable_dockmove_y:              0
variable_dockmove_z:              0

# Рух заходу в док (відносний)
variable_attachmove_x:            0
variable_attachmove_y:           30
variable_attachmove_z:            0

# Проміжний рух при стикуванні (зазвичай 0)
variable_attachmove2_x:           0
variable_attachmove2_y:           0
variable_attachmove2_z:           0

# Відхід від кінцевиків після хомінгу
variable_home_backoff_x:         10
variable_home_backoff_y:         10

# Порядок хомінгу: '' — логіка Klicky за замовчуванням. Через
# attachmove_y != 0 гілка "спочатку Y" не активна, тому порядок
# X → Y — такий самий, як був на цьому принтері.
variable_override_homing:        ''

# Прибирати щуп у док під час хомінгу Z, якщо він не потрібен
variable_dock_on_zhome:        True

# Аварійне відключення стикування (наприклад, для ручних тестів)
variable_bypass_probe_docking: False

# Обплутаний кабель: проміжна точка, щоб кабель не зачіпав док
variable_umbilical:           False
variable_umbilical_x:            15
variable_umbilical_y:            15

# Паркування після стикування/дока
variable_park_toolhead:       False
variable_parkposition_x:        125
variable_parkposition_y:        125
variable_parkposition_z:         30

gcode:
    {% set Mx = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set My = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set Ox = printer.configfile.config["probe"]["x_offset"]|float %}
    {% set Oy = printer.configfile.config["probe"]["y_offset"]|float %}

    {% if z_endstop_x != 0 or z_endstop_y != 0 %}
        SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=z_endstop_x VALUE={ z_endstop_x }
        SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=z_endstop_y VALUE={ z_endstop_y }
    {% else %}
        SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=z_endstop_x VALUE={ Mx * 0.5 - Ox }
        SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=z_endstop_y VALUE={ My * 0.5 - Oy }
    {% endif %}

#####################################################################
#  Стан щупа
#####################################################################
[gcode_macro _Probe_Variables]
variable_probe_attached:   False
variable_probe_state:      False
variable_probe_lock:       False
variable_z_endstop_x:          0
variable_z_endstop_y:          0
gcode:

# Зчитати стан кінцевика щупа і, за потреби, змінити прапорці
[gcode_macro _CheckProbe]
description: Опитати щуп і оновити стан
gcode:
    QUERY_PROBE
    _SetProbeState action={ params.ACTION }

# Читає результат QUERY_PROBE (окремий макрос, бо шаблон
# обчислюється до виконання QUERY_PROBE)
[gcode_macro _SetProbeState]
gcode:
    {% set query_probe_triggered = printer.probe.last_query %}
    {% set action = params.ACTION|default('') %}

    # Спрацював = щупа на голові немає (він у доку)
    {% if query_probe_triggered %}
        SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=probe_attached VALUE={ False }
    {% else %}
        SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=probe_attached VALUE={ True }
    {% endif %}

    {% if action == 'query' %}
        SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=probe_state VALUE={ query_probe_triggered }
    {% endif %}

    {% if not query_probe_triggered and action == 'dock' %}
        { action_raise_error("Klicky: щуп не став у док") }
    {% endif %}
    {% if query_probe_triggered and action == 'attach' %}
        { action_raise_error("Klicky: щуп не приєднався") }
    {% endif %}

# Скидання блокування перед повним хомінгом
[gcode_macro _Homing_Variables]
gcode:
    {% set reset = params.RESET|default(0) %}
    {% if reset %}
        SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=probe_lock VALUE={ False }
    {% endif %}

# Блокування: доки не розблоковано, щуп не поїде в док
[gcode_macro _Probe_Lock]
description: Заблокувати щуп на голові
gcode:
    SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=probe_lock VALUE={ True }

[gcode_macro _Probe_Unlock]
description: Зняти блокування щупа
gcode:
    SET_GCODE_VARIABLE MACRO=_Probe_Variables VARIABLE=probe_lock VALUE={ False }

[gcode_macro Attach_Probe_Lock]
description: Взяти щуп і заблокувати його
gcode:
    Attach_Probe
    _Probe_Lock

[gcode_macro Dock_Probe_Unlock]
description: Зняти блокування і прибрати щуп
gcode:
    _Probe_Unlock
    Dock_Probe

#####################################################################
#  Службові макроси (збереження/відновлення стану G-code)
#####################################################################
[gcode_macro _entry_point]
gcode:
    {% set function = 'pre_' ~ params.FUNCTION %}
    {% set move_accel = printer["gcode_macro _User_Variables"].move_accel|default(4000) %}
    # обов'язково: фіксуємо безпечну позицію
    M400
    SAVE_GCODE_STATE NAME={function}
    # прибираємо Z-offset, щоб док працював від столу
    SET_GCODE_OFFSET Z=0
    G90
    SET_VELOCITY_LIMIT ACCEL={move_accel}

[gcode_macro _exit_point]
gcode:
    {% set function = 'pre_' ~ params.FUNCTION %}
    {% set move = params.MOVE|default(0) %}
    {% set speed = printer["gcode_macro _User_Variables"].travel_speed %}
    M400
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    RESTORE_GCODE_STATE NAME={function} MOVE={move} MOVE_SPEED={speed}

#####################################################################
#  Стикування щупа
#####################################################################
[gcode_macro Attach_Probe]
description: Взяти щуп Klicky з дока
gcode:
    # BACK=1 — повернутися в позицію до стикування
    {% set goback = params.BACK|default(0) %}
    {% set probe_attached = printer["gcode_macro _Probe_Variables"].probe_attached %}
    {% set probe_lock = printer["gcode_macro _Probe_Variables"].probe_lock %}
    {% set verbose = printer["gcode_macro _User_Variables"].verbose %}
    {% set docklocation_x = printer["gcode_macro _User_Variables"].docklocation_x %}
    {% set docklocation_y = printer["gcode_macro _User_Variables"].docklocation_y %}
    {% set docklocation_z = printer["gcode_macro _User_Variables"].docklocation_z %}
    {% set attachmove_x = printer["gcode_macro _User_Variables"].attachmove_x|default(0) %}
    {% set attachmove_y = printer["gcode_macro _User_Variables"].attachmove_y|default(0) %}
    {% set attachmove_z = printer["gcode_macro _User_Variables"].attachmove_z|default(0) %}
    {% set attachmove2_x = printer["gcode_macro _User_Variables"].attachmove2_x|default(0) %}
    {% set attachmove2_y = printer["gcode_macro _User_Variables"].attachmove2_y|default(0) %}
    {% set attachmove2_z = printer["gcode_macro _User_Variables"].attachmove2_z|default(0) %}
    {% set safe_z = printer["gcode_macro _User_Variables"].safe_z %}
    {% set enable_z_hop = printer["gcode_macro _User_Variables"].enable_z_hop %}
    {% set travel_feedrate = printer["gcode_macro _User_Variables"].travel_speed * 60 %}
    {% set dock_feedrate = printer["gcode_macro _User_Variables"].dock_speed * 60 %}
    {% set release_feedrate = printer["gcode_macro _User_Variables"].release_speed * 60 %}
    {% set z_drop_feedrate = printer["gcode_macro _User_Variables"].z_drop_speed * 60 %}
    {% set bypass_probe_docking = printer["gcode_macro _User_Variables"].bypass_probe_docking|default(False) %}

    _entry_point function=Attach_Probe

    {% if bypass_probe_docking == False %}

        {% if not 'xy' in printer.toolhead.homed_axes %}
            { action_raise_error("Спочатку відхомуйте X та Y!") }

        {% elif not probe_attached and not probe_lock %}
            {% if verbose %}
                { action_respond_info("Стикування щупа") }
            {% endif %}

            # Z ще не відхомовано — задаємо фіктивний нуль, щоб мати
            # безпечну висоту для руху до дока
            {% if not 'z' in printer.toolhead.homed_axes %}
                SET_KINEMATIC_POSITION Z=0
                {% if not enable_z_hop %}
                    {% set safe_z = 0 %}
                {% endif %}
            {% endif %}

            {% if printer.gcode_move.gcode_position.z < safe_z %}
                {% if verbose %}
                    { action_respond_info("Підйом на безпечну Z") }
                {% endif %}
                G0 Z{safe_z} F{z_drop_feedrate}
            {% endif %}

            _Umbilical_Path
            _entry_point function=Attach_Probe_intern

            # Підхід до дока
            G0 X{docklocation_x|int - attachmove_x|int - attachmove2_x|int} Y{docklocation_y|int - attachmove_y|int - attachmove2_y} F{travel_feedrate}
            {% if docklocation_z != -128 %}
                G0 Z{docklocation_z|int - attachmove_z|int - attachmove2_z|int} F{dock_feedrate}
                G0 Z{docklocation_z|int - attachmove_z|int} F{dock_feedrate}
            {% endif %}

            # Захід у док
            {% if docklocation_z != -128 %}
                G0 Z{docklocation_z} F{dock_feedrate}
            {% endif %}
            G0 X{docklocation_x|int - attachmove2_x|int} Y{docklocation_y|int - attachmove2_y} F{dock_feedrate}
            G0 X{docklocation_x} Y{docklocation_y} F{dock_feedrate}

            # Вихід із дока зі щупом
            {% if docklocation_z != -128 %}
                G0 Z{docklocation_z|int - attachmove_z|int} F{z_drop_feedrate}
            {% endif %}
            G0 X{docklocation_x|int - attachmove_x|int} Y{docklocation_y|int - attachmove_y|int} F{release_feedrate}

            {% if (printer.gcode_move.gcode_position.z < safe_z) or (docklocation_z != -128 and docklocation_z < safe_z) %}
                G0 Z{safe_z} F{z_drop_feedrate}
            {% endif %}

            _Park_Toolhead
            _CheckProbe action=attach

            _exit_point function=Attach_Probe_intern move={goback}

        {% elif probe_lock %}
            {% if verbose %}
                { action_respond_info("Щуп заблокований на голові") }
            {% endif %}
            _CheckProbe action=query

        {% else %}
            {% if verbose %}
                { action_respond_info("Щуп уже на голові") }
            {% endif %}
            _CheckProbe action=query

        {% endif %}

    {% endif %}

    _exit_point function=Attach_Probe

#####################################################################
#  Док щупа
#####################################################################
[gcode_macro Dock_Probe]
description: Прибрати щуп Klicky у док
gcode:
    {% set goback = params.BACK|default(0) %}
    {% set probe_attached = printer["gcode_macro _Probe_Variables"].probe_attached %}
    {% set probe_lock = printer["gcode_macro _Probe_Variables"].probe_lock %}
    {% set verbose = printer["gcode_macro _User_Variables"].verbose %}
    {% set docklocation_x = printer["gcode_macro _User_Variables"].docklocation_x %}
    {% set docklocation_y = printer["gcode_macro _User_Variables"].docklocation_y %}
    {% set docklocation_z = printer["gcode_macro _User_Variables"].docklocation_z %}
    {% set dockmove_x = printer["gcode_macro _User_Variables"].dockmove_x|default(0) %}
    {% set dockmove_y = printer["gcode_macro _User_Variables"].dockmove_y|default(0) %}
    {% set dockmove_z = printer["gcode_macro _User_Variables"].dockmove_z|default(0) %}
    {% set attachmove_x = printer["gcode_macro _User_Variables"].attachmove_x|default(0) %}
    {% set attachmove_y = printer["gcode_macro _User_Variables"].attachmove_y|default(0) %}
    {% set attachmove_z = printer["gcode_macro _User_Variables"].attachmove_z|default(0) %}
    {% set safe_z = printer["gcode_macro _User_Variables"].safe_z|float %}
    {% set travel_feedrate = printer["gcode_macro _User_Variables"].travel_speed * 60 %}
    {% set dock_feedrate = printer["gcode_macro _User_Variables"].dock_speed * 60 %}
    {% set release_feedrate = printer["gcode_macro _User_Variables"].release_speed * 60 %}
    {% set z_drop_feedrate = printer["gcode_macro _User_Variables"].z_drop_speed * 60 %}
    {% set bypass_probe_docking = printer["gcode_macro _User_Variables"].bypass_probe_docking|default(False) %}

    {% if bypass_probe_docking != True %}

        _entry_point function=Dock_Probe

        {% if probe_attached and not probe_lock %}

            {% if printer.gcode_move.gcode_position.z < safe_z %}
                G0 Z{safe_z} F{z_drop_feedrate}
            {% endif %}

            _Umbilical_Path

            # Підхід до дока
            G0 X{docklocation_x|int - attachmove_x|int} Y{docklocation_y|int - attachmove_y|int} F{travel_feedrate}
            {% if docklocation_z != -128 %}
                G0 Z{docklocation_z|int - attachmove_z|int} F{dock_feedrate}
            {% endif %}

            G0 X{docklocation_x} Y{docklocation_y} F{dock_feedrate}
            {% if docklocation_z != -128 %}
                G0 Z{docklocation_z} F{dock_feedrate}
            {% endif %}

            # Відрив від магнітів
            {% if docklocation_z != -128 %}
                G0 Z{docklocation_z|int + dockmove_z|int} F{release_feedrate}
            {% endif %}
            G0 X{docklocation_x|int + dockmove_x|int} Y{docklocation_y|int + dockmove_y|int} F{release_feedrate}

            # І ще трохи від'їхати, щоб не зачепити щуп
            G0 X{docklocation_x|int + dockmove_x|int - attachmove_x|int} Y{docklocation_y|int + dockmove_y|int - attachmove_y|int} F{release_feedrate}

            {% if printer.gcode_move.gcode_position.z < safe_z %}
                G0 Z{safe_z} F{z_drop_feedrate}
            {% endif %}

            _Park_Toolhead

            G4 P1000
            _CheckProbe action=dock

        {% elif probe_lock %}
            {% if verbose %}
                { action_respond_info("Щуп заблокований — у док не їде") }
            {% endif %}
            _CheckProbe action=query

        {% else %}
            {% if verbose %}
                { action_respond_info("Щуп уже в доку") }
            {% endif %}
            _CheckProbe action=query

        {% endif %}

    {% endif %}

    _exit_point function=Dock_Probe move={goback}

#####################################################################
#  Допоміжні рухи
#####################################################################
[gcode_macro _Umbilical_Path]
gcode:
    {% set umbilical = printer["gcode_macro _User_Variables"].umbilical %}
    {% set umbilical_x = printer["gcode_macro _User_Variables"].umbilical_x %}
    {% set umbilical_y = printer["gcode_macro _User_Variables"].umbilical_y %}
    {% set safe_z = printer["gcode_macro _User_Variables"].safe_z|float %}
    {% set travel_feedrate = printer["gcode_macro _User_Variables"].travel_speed * 60 %}

    {% if umbilical %}
        _entry_point function=Umbilical_Path
        G0 X{umbilical_x} Y{umbilical_y} Z{safe_z} F{travel_feedrate}
        _exit_point function=Umbilical_Path
    {% endif %}

[gcode_macro _Park_Toolhead]
gcode:
    {% set park_toolhead = printer["gcode_macro _User_Variables"].park_toolhead %}
    {% set parkposition_x = printer["gcode_macro _User_Variables"].parkposition_x %}
    {% set parkposition_y = printer["gcode_macro _User_Variables"].parkposition_y %}
    {% set parkposition_z = printer["gcode_macro _User_Variables"].parkposition_z %}
    {% set travel_feedrate = printer["gcode_macro _User_Variables"].travel_speed * 60 %}

    _entry_point function=Park_Toolhead

    {% if park_toolhead and 'xyz' in printer.toolhead.homed_axes %}
        {% if parkposition_z == -128 %}
            G0 X{parkposition_x} Y{parkposition_y} F{travel_feedrate}
        {% else %}
            G0 X{parkposition_x} Y{parkposition_y} Z{parkposition_z} F{travel_feedrate}
        {% endif %}
    {% endif %}

    _exit_point function=Park_Toolhead

#####################################################################
#  Хомінг Z щупом
#####################################################################
[gcode_macro _Home_Z_]
description: Хомінг Z у центрі столу (щуп уже на голові)
gcode:
    {% set z_endstop_x = printer["gcode_macro _Probe_Variables"].z_endstop_x %}
    {% set z_endstop_y = printer["gcode_macro _Probe_Variables"].z_endstop_y %}
    {% set safe_z = printer["gcode_macro _User_Variables"].safe_z|float %}
    {% set travel_feedrate = printer["gcode_macro _User_Variables"].travel_speed * 60 %}
    {% set z_drop_feedrate = printer["gcode_macro _User_Variables"].z_drop_speed * 60 %}
    {% set verbose = printer["gcode_macro _User_Variables"].verbose %}

    _entry_point function=Home_Z

    {% if not 'xy' in printer.toolhead.homed_axes %}
        { action_raise_error("Спочатку відхомуйте X та Y!") }
    {% else %}
        {% if not 'z' in printer.toolhead.homed_axes %}
            {% if verbose %}
                { action_respond_info("Скидання Z у нуль") }
            {% endif %}
            SET_KINEMATIC_POSITION Z=0
        {% endif %}

        G0 X{z_endstop_x} Y{z_endstop_y} F{travel_feedrate}
        G28 Z0
        G0 Z{safe_z} F{z_drop_feedrate}
    {% endif %}

    _exit_point function=Home_Z

#####################################################################
#  Безконтактний хомінг X/Y (TMC2240 StallGuard)
#  Струм підвищується лише на час хомінгу, потім повертається.
#####################################################################
[gcode_macro _HOME_X]
description: Хомінг X по StallGuard
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2240 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2240 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.5 %}

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    G28 X

    # Від'їзд від правої стінки (355 → 345)
    G91
    G1 X-10 F1200
    G90

    G4 P2000   ; пауза, щоб StallGuard заспокоївся

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

[gcode_macro _HOME_Y]
description: Хомінг Y по StallGuard
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2240 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2240 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 1.4 %}

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    G28 Y

    # Від'їзд від задньої стінки (350 → 340)
    G91
    G1 Y-10 F1200
    G90

    G4 P2000   ; пауза, щоб StallGuard заспокоївся

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

#####################################################################
#  Головний хомінг: X/Y (StallGuard) + Z (щуп Klicky)
#
#  G28 X / G28 Y всередині цього макросу виконуються як звичайний
#  хомінг (Klipper захищає від рекурсії), тому _HOME_X / _HOME_Y
#  можуть спокійно кликати G28.
#####################################################################
[homing_override]
axes: xyz
gcode:
    _User_Variables
    {% set verbose = printer["gcode_macro _User_Variables"].verbose %}
    {% set safe_z = printer["gcode_macro _User_Variables"].safe_z|float %}
    {% set enable_z_hop = printer["gcode_macro _User_Variables"].enable_z_hop %}
    {% set dock_on_zhome = printer["gcode_macro _User_Variables"].dock_on_zhome|default(True) %}
    {% set attachmove_y = printer["gcode_macro _User_Variables"].attachmove_y|default(0) %}
    {% set z_drop_feedrate = printer["gcode_macro _User_Variables"].z_drop_speed * 60 %}
    {% set travel_feedrate = printer["gcode_macro _User_Variables"].travel_speed * 60 %}
    {% set home_backoff_x = printer["gcode_macro _User_Variables"].home_backoff_x|default(0) %}
    {% set home_backoff_y = printer["gcode_macro _User_Variables"].home_backoff_y|default(0) %}
    {% set override_homing = printer["gcode_macro _User_Variables"].override_homing|default('') %}
    {% set kinematic_z = 0 %}

    _CheckProbe action=query

    # Які осі просили відхомувати
    {% set home_x, home_y, home_z, leave_probe_attached = False, False, False, False %}
    {% if not 'X' in params and not 'Y' in params and not 'Z' in params %}
        {% set home_x, home_y, home_z = True, True, True %}
    {% else %}
        {% if 'X' in params %}
            {% set home_x = True %}
        {% endif %}
        {% if 'Y' in params %}
            {% set home_y = True %}
        {% endif %}
        {% if 'Z' in params %}
            {% set home_z = True %}
        {% endif %}
        {% if 'X' in params and 'Y' in params and 'Z' in params %}
            _Homing_Variables reset=1
        {% endif %}
    {% endif %}

    # PROBE_LOCK: залишити щуп на голові після хомінгу
    {% if 'PROBE_LOCK' in params %}
        {% set leave_probe_attached = True %}
    {% endif %}

    _entry_point function=homing_override

    # Якщо Z не відхомовано і z_hop вимкнено — не рухаємо Z
    {% if 'z' not in printer.toolhead.homed_axes and not enable_z_hop %}
        {% set kinematic_z = safe_z %}
    {% endif %}

    # Перший G28 після втрати живлення: піднімаємо голову на безпечну Z
    {% if 'x' not in printer.toolhead.homed_axes and 'y' not in printer.toolhead.homed_axes and 'z' not in printer.toolhead.homed_axes %}
        {% if verbose %}
            { action_respond_info("Осі не відхомовані") }
        {% endif %}
        SET_KINEMATIC_POSITION X=0 Y=0 Z={kinematic_z}
        M400
        {% if verbose %}
            { action_respond_info("Підйом на безпечну Z") }
        {% endif %}
        G0 Z{safe_z} F{z_drop_feedrate}

        {% if home_z != True %}
            # SET_KINEMATIC_POSITION позначає осі як відхомовані;
            # M84 — єдиний спосіб скинути цей фіктивний стан.
            M84
        {% endif %}
    {% else %}
        # Усе відхомовано — далі безпечною вважаємо поточну Z
        {% set safe_z = printer.gcode_move.gcode_position.z|float %}
    {% endif %}

    # Хомінг Z без X/Y неможливий — робимо повний
    {% if home_z %}
        {% if 'x' not in printer.toolhead.homed_axes and 'y' not in printer.toolhead.homed_axes %}
            {% if verbose %}
                { action_respond_info("X/Y не відхомовані — повний G28") }
            {% endif %}
            {% set home_x, home_y, home_z = True, True, True %}
        {% endif %}
    {% endif %}

    # Док стоїть ззаду: якщо док не змушує починати з X,
    # спершу хомімо Y (щоб не їхати в док)
    {% if (attachmove_y == 0 and override_homing == '') or override_homing == 'Y' %}
        {% if home_y %}
            {% if verbose %}
                { action_respond_info("Хомінг Y") }
            {% endif %}
            {% if 'z' in printer.toolhead.homed_axes and printer.gcode_move.gcode_position.z < safe_z %}
                G0 Z{safe_z} F{z_drop_feedrate}
            {% endif %}
            {% if printer["gcode_macro _HOME_Y"] is defined %}
                _HOME_Y
            {% else %}
                G28 Y0
                {% if home_backoff_y != 0 %}
                    {% if printer.configfile.settings.stepper_y.position_endstop > (printer.configfile.settings.stepper_y.position_min|default(0) + printer.configfile.settings.stepper_y.position_max) / 2 %}
                        G0 Y{printer.configfile.settings.stepper_y.position_endstop - home_backoff_y|int} F{travel_feedrate}
                    {% else %}
                        G0 Y{printer.configfile.settings.stepper_y.position_endstop + home_backoff_y|int} F{travel_feedrate}
                    {% endif %}
                {% endif %}
            {% endif %}
        {% endif %}
        {% set home_y = False %}
    {% endif %}

    # Хомінг X
    {% if home_x %}
        {% if verbose %}
            { action_respond_info("Хомінг X") }
        {% endif %}
        {% if 'z' in printer.toolhead.homed_axes and printer.gcode_move.gcode_position.z < safe_z %}
            G0 Z{safe_z} F{z_drop_feedrate}
        {% endif %}
        {% if printer["gcode_macro _HOME_X"] is defined %}
            _HOME_X
        {% else %}
            G28 X0
            {% if home_backoff_x != 0 %}
                {% if printer.configfile.settings.stepper_x.position_endstop > (printer.configfile.settings.stepper_x.position_min|default(0) + printer.configfile.settings.stepper_x.position_max) / 2 %}
                    G0 X{printer.configfile.settings.stepper_x.position_endstop - home_backoff_x|int} F{travel_feedrate}
                {% else %}
                    G0 X{printer.configfile.settings.stepper_x.position_endstop + home_backoff_x|int} F{travel_feedrate}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}

    # Хомінг Y (якщо ще не зробили вище)
    {% if home_y %}
        {% if verbose %}
            { action_respond_info("Хомінг Y") }
        {% endif %}
        {% if 'z' in printer.toolhead.homed_axes and printer.gcode_move.gcode_position.z < safe_z %}
            G0 Z{safe_z} F{z_drop_feedrate}
        {% endif %}
        {% if printer["gcode_macro _HOME_Y"] is defined %}
            _HOME_Y
        {% else %}
            G28 Y0
            {% if home_backoff_y != 0 %}
                {% if printer.configfile.settings.stepper_y.position_endstop > (printer.configfile.settings.stepper_y.position_min|default(0) + printer.configfile.settings.stepper_y.position_max) / 2 %}
                    G0 Y{printer.configfile.settings.stepper_y.position_endstop - home_backoff_y|int} F{travel_feedrate}
                {% else %}
                    G0 Y{printer.configfile.settings.stepper_y.position_endstop + home_backoff_y|int} F{travel_feedrate}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}

    # Хомінг Z
    {% if home_z %}
        {% if verbose %}
            { action_respond_info("Хомінг Z") }
        {% endif %}
        {% if 'z' in printer.toolhead.homed_axes and printer.gcode_move.gcode_position.z < safe_z %}
            G0 Z{safe_z} F{z_drop_feedrate}
        {% endif %}

        {% if 'z_virtual_endstop' in printer.configfile.config["stepper_z"]["endstop_pin"] %}
            Attach_Probe
            {% if leave_probe_attached %}
                _Probe_Lock
            {% endif %}
        {% elif dock_on_zhome == True %}
            Dock_Probe
        {% endif %}

        _Home_Z_

        {% if 'z_virtual_endstop' in printer.configfile.config["stepper_z"]["endstop_pin"] %}
            Dock_Probe
        {% elif dock_on_zhome == False %}
            Dock_Probe
        {% endif %}
    {% endif %}

    _CheckProbe action=query
    _Park_Toolhead
    _exit_point function=homing_override

#####################################################################
#  QUAD_GANTRY_LEVEL з автоматичним стикуванням щупа
#####################################################################
[gcode_macro QUAD_GANTRY_LEVEL]
description: Вирівнювання порталу зі щупом Klicky
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    {% set V = printer["gcode_macro _User_Variables"].verbose %}
    {% if V %}
        { action_respond_info("QGL зі щупом Klicky") }
    {% endif %}

    _CheckProbe action=query
    G90

    # Беремо щуп один раз
    Attach_Probe

    # Вирівнюємо портал (щуп уже на голові)
    _QUAD_GANTRY_LEVEL {% for p in params %}{'%s=%s ' % (p, params[p])}{% endfor %}

    # Повторний хомінг Z: щуп на голові, Klicky не робить зайвих рухів
    G28 Z

    # І тільки тепер щуп їде в док
    Dock_Probe

#####################################################################
#  Калібрування щупа
#####################################################################
[gcode_macro PROBE_CALIBRATE]
description: Калібрування z_offset щупа Klicky
rename_existing: _PROBE_CALIBRATE
gcode:
    {% set max_x = printer["gcode_macro _User_Variables"].max_bed_x|float %}
    {% set max_y = printer["gcode_macro _User_Variables"].max_bed_y|float %}
    {% set probe_offset_x = printer['configfile'].config["probe"]["x_offset"]|float %}
    {% set probe_offset_y = printer['configfile'].config["probe"]["y_offset"]|float %}
    {% set bypass_probe_docking = printer["gcode_macro _User_Variables"].bypass_probe_docking|default(False) %}

    {% if not 'xyz' in printer.toolhead.homed_axes %}
        { action_raise_error("Спочатку відхомуйте X, Y та Z!") }
    {% endif %}

    # Захист: калібрування тільки над столом
    {% if printer['gcode_move'].position.y > (max_y - probe_offset_y)
          or printer['gcode_move'].position.y < -probe_offset_y
          or printer['gcode_move'].position.x > (max_x - probe_offset_x)
          or printer['gcode_move'].position.x < -probe_offset_x %}
        { action_raise_error("PROBE_CALIBRATE: щуп має бути над столом") }
    {% endif %}

    {% if bypass_probe_docking == False %}
        _CheckProbe action=query
        G90
        Attach_Probe back=1
        _PROBE_CALIBRATE {% for p in params %}{'%s=%s ' % (p, params[p])}{% endfor %}
        M118 Піднімаємо голову на 20 мм
        TESTZ Z=20
        M118 Зніміть щуп вручну і завершіть калібрування
    {% else %}
        _PROBE_CALIBRATE {% for p in params %}{'%s=%s ' % (p, params[p])}{% endfor %}
    {% endif %}

[gcode_macro PROBE_ACCURACY]
description: Точність щупа в поточній точці
rename_existing: _PROBE_ACCURACY
gcode:
    {% set max_x = printer["gcode_macro _User_Variables"].max_bed_x|float %}
    {% set max_y = printer["gcode_macro _User_Variables"].max_bed_y|float %}
    {% set probe_offset_x = printer['configfile'].config["probe"]["x_offset"]|float %}
    {% set probe_offset_y = printer['configfile'].config["probe"]["y_offset"]|float %}

    {% if not 'xyz' in printer.toolhead.homed_axes %}
        { action_raise_error("Спочатку відхомуйте X, Y та Z!") }
    {% endif %}

    _entry_point function=PROBE_ACCURACY

    # Захист: вимірювання тільки над столом
    {% if printer['gcode_move'].position.y > (max_y - probe_offset_y)
          or printer['gcode_move'].position.y < -probe_offset_y
          or printer['gcode_move'].position.x > (max_x - probe_offset_x)
          or printer['gcode_move'].position.x < -probe_offset_x %}
        { action_raise_error("PROBE_ACCURACY: щуп має бути над столом") }
    {% endif %}

    _CheckProbe action=query
    Attach_Probe back=1

    _PROBE_ACCURACY {% for p in params %}{'%s=%s ' % (p, params[p])}{% endfor %}

    Dock_Probe back=1

    _exit_point function=PROBE_ACCURACY move=1
