#####################################################################
##                         TOOLHEAD (T1 CAN MCU)
#####################################################################
[mcu T1]
canbus_uuid: d446594edc03                   # t1: d446594edc03 (t2: dd9509baa7c3)


[temperature_sensor T1]
sensor_type: Generic 3950
sensor_pin: T1: gpio28

#####################################################################
##                         ACCELEROMETER (ADXL345)
#####################################################################
[adxl345]
cs_pin: T1:gpio1
spi_speed: 5000000
rate: 1600
spi_software_sclk_pin: T1:gpio2
spi_software_mosi_pin: T1:gpio0
spi_software_miso_pin: T1:gpio3
axes_map: z, -y, x

#####################################################################
##                         EXTRUDER & HEATER
#####################################################################
[extruder]
step_pin: T1:gpio18
dir_pin: T1:gpio19
enable_pin: !T1:gpio17
microsteps: 8
rotation_distance: 47.212
gear_ratio: 9:1
full_steps_per_rotation: 200	# 200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: T1:gpio7
sensor_type: PT1000
pullup_resistor: 4700
sensor_pin: T1:gpio27
min_temp: -50
max_temp: 300
max_extrude_cross_section: 5
instantaneous_corner_velocity: 1.5
max_extrude_only_distance: 101

[tmc2209 extruder]
uart_pin: T1:gpio20
run_current: 0.70
sense_resistor: 0.11

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg-9T
tuning_goal = performance

[verify_heater extruder]
max_error: 120
check_gain_time: 120
hysteresis: 50
heating_gain: 2

#####################################################################
##                         NEOPIXEL LED
#####################################################################
# [neopixel Toolhead1_rgb]
# pin: T1:gpio16
# chain_count: 10
# color_order: GRB
# initial_RED: 0.2
# initial_GREEN: 0.2
# initial_BLUE: 0.2

#####################################################################
##                         PROBE (TAP)
#####################################################################
[probe]
pin: T1:gpio24
x_offset: 0
y_offset: 19.75
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.01
samples_tolerance_retries: 3


#####################################################################
##                         FANS
#####################################################################
[fan]
pin: T1:gpio13
cycle_time: 0.01      
hardware_pwm: False
kick_start_time: 0.5
off_below: 0.2

[heater_fan hotend_fan]
pin: T1:gpio14
heater: extruder
heater_temp: 50.0