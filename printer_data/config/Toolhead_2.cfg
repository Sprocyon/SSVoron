[mcu EBBCan2]
canbus_uuid: dd9509baa7c3 

[thermistor ATC Semitec 104NT-4-R025H42G]
temperature1: 25
resistance1: 100000
temperature2: 160
resistance2: 1074
temperature3: 300
resistance3: 82.78

[temperature_sensor Toolhead2]
sensor_type: Generic 3950
sensor_pin: EBBCan2: gpio28



#####################################################################
##                  Extruder motor
#####################################################################

[extruder]
step_pin: EBBCan2:gpio18
dir_pin: EBBCan2:gpio19
enable_pin: !EBBCan2:gpio17
microsteps: 16
rotation_distance: 42.92
gear_ratio: 9:1
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: EBBCan2:gpio7
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBCan2:gpio27
min_temp: -50 #<-- important
max_temp: 300 #<-- important
control: pid
pid_Kp: 21.674
pid_Ki: 2.035
pid_Kd: 57.0706
min_temp: 0
max_temp: 250


[tmc2209 extruder]
uart_pin: EBBCan2:gpio20
run_current: 0.6
stealthchop_threshold: 99999



#####################################################################
##	               TAP
#####################################################################
[probe]
pin: EBBCan2:gpio6
x_offset: 0
y_offset: 25
#z_offset: 0
speed: 8.0     # when using induction, set to 10
samples: 3
samples_result: median
sample_retract_dist: 1.0
samples_tolerance: 0.07
samples_tolerance_retries: 3
activate_gcode:
    {% set PROBE_TEMP = 130 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}


#--------------------------------------------------------------------
[fan]
pin: EBBCan2:gpio13
[heater_fan hotend_fan]
pin: EBBCan2:gpio14
heater: extruder
heater_temp: 50.0
[fan_generic 4W_FAN0]
pin: EBBCan2:gpio15
tachometer_pin: EBBCan2:gpio12
#tachometer_ppr: 1
#_____________________________________________________________________
[neopixel Toolhead2_rgb]
pin: EBBCan2:gpio16
chain_count: 10              # Number of lamp beads
color_order: RGB             # colour sequence
initial_RED: 1             # Initial red brightness
initial_GREEN: 1          # Initial green brightness
initial_BLUE: 1           # Initial blue brightness