[gcode_macro _HOME_X]
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2240 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2240 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.5 %}  
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Чистий сенсорлесс-хомінг X
    G28 X

    # Відкат від правої стінки (з 355 у бік 345)
    G91
    G1 X-10 F1200
    G90
    
    G4 P2000  # Пауза для StallGuard

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}


[gcode_macro _HOME_Y]
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2240 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2240 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 1.4 %}   
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Чистий сенсорлесс-хомінг Y
    G28 Y

    # Відкат від задньої стінки (з 350 у бік 340)
    G91
    G1 Y-10 F1200
    G90
    
    G4 P2000  # Пауза для StallGuard

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}


[homing_override]
axes: z
set_position_z: 0
gcode:
    # 1. Хомінг X та Y, якщо вони ще не захомовані
    {% if 'x' not in printer.toolhead.homed_axes %}
        _HOME_X
    {% endif %}
    {% if 'y' not in printer.toolhead.homed_axes %}
        _HOME_Y
    {% endif %}

    # 2. Безпечний підйом Z на 10 мм
    G91
    G1 Z10 F600
    G90

    # 3. Встановлюємо тимчасову висоту Z=10, щоб Klicky бачив, що Z безпечний
    SET_KINEMATIC_POSITION Z=10

    # 4. Зачіпаємо щуп Klicky
    ATTACH_PROBE

    # 5. Переїзд у центр столу Voron 350 (X175 Y175)
    G1 X175 Y175 F12000

    # 6. Вимірювання Z
    PROBE
    
    # 7. Фіксація нуля Z та підйом сопла
    G92 Z0
    G1 Z20 F1200

    # 8. Повернення щупа в док
    DOCK_PROBE