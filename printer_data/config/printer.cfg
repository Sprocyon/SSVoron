#python3 ~/katapult/scripts/flashtool.py -f ~/klipper/out/klipper.bin -d /dev/serial/by-id/usb-katapult_stm32f446xx_530021000751313133353932-if00


#####################################################################
## 	                MCU  BTT PI 2
#####################################################################
# [mcu BTTPI]
# serial: /tmp/klipper_host_mcu
#####################################################################

#####################################################################
##                 TOOLHEAD
#####################################################################
#python3 ~/katapult/scripts/flashtool.py -i can0 -u dd9509baa7c3 -r
#python3 ~/katapult/scripts/flashtool.py -i can0 -u dd9509baa7c3 -f ~/klipper/out/klipper.bin
[mcu T1]
canbus_uuid: dd9509baa7c3 
[thermistor ATC Semitec 104NT-4-R025H42G]
temperature1: 25
resistance1: 100000
temperature2: 160
resistance2: 1074
temperature3: 300
resistance3: 82.78

[temperature_sensor T1]
sensor_type: Generic 3950
sensor_pin: T1: gpio28


[adxl345]
cs_pin: T1:gpio1
spi_speed: 5000000
rate: 1600
spi_software_sclk_pin: T1:gpio2
spi_software_mosi_pin: T1:gpio0
spi_software_miso_pin: T1:gpio3
axes_map: z,-y,x

[resonance_tester]
accel_per_hz:100
max_freq:175
probe_points: 175, 175, 20
accel_chip: adxl345

[input_shaper]
shaper_type_x = ei
shaper_freq_x = 51.2
shaper_type_y = mzv
shaper_freq_y = 39.0

# #####################################################################
# ##                  Extruder motor
# #####################################################################

[extruder]
step_pin: T1:gpio18
dir_pin: T1:gpio19
enable_pin: !T1:gpio17
microsteps: 16
rotation_distance: 47.212
gear_ratio: 9:1
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: T1:gpio7
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: T1:gpio27
min_temp: -50
max_temp: 300
max_extrude_cross_section: 5
max_extrude_only_distance: 101

[tmc2209 extruder]
uart_pin: T1:gpio20
run_current: 0.65
hold_current: 0.1
sense_resistor: 0.11 #WTF
stealthchop_threshold: 0

# #--------------------------------------------------------------------
[verify_heater extruder]   # Heating Block Temperature Tolerance Configuration
max_error: 120             # maximum error
check_gain_time:120        # tolerance time
hysteresis: 50             # tolerance temperature
heating_gain: 2            # Heating Gain

# #--------------------------------------------------------------------
[neopixel Toolhead1_rgb]
pin: T1:gpio16
chain_count: 10              # Number of lamp beads
color_order: RGB             # colour sequence
initial_RED: 0.2             # Initial red brightness
initial_GREEN: 0.2           # Initial green brightness
initial_BLUE: 0.2            # Initial blue brightness
# #####################################################################
# ##	               TAP
# #####################################################################
# #0.4 Revo + PEI gold = -0.435
# #1.2 nozzle z_offset =-0.375
# #
[probe]
pin: !T1:gpio22
x_offset: 0
y_offset: 0
#z_offset: 0
speed: 8.0     # when using induction, set to 10
samples: 4
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.05
samples_tolerance_retries: 3
activate_gcode:
    {% set PROBE_TEMP = 130 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

# #####################################################################
# #                  FAN
# #####################################################################
[fan]
pin: T1:gpio13
cycle_time: 0.00001     #10 kHz PWM signal
hardware_pwm: False
kick_start_time: 0.3
off_below: 0.2

[heater_fan hotend_fan]
pin: T1:gpio14
heater: extruder
heater_temp: 50.0

#####################################################################
#                    Model and acceleration
#####################################################################
[printer]
kinematics: corexy           # Printer type：corexy
max_velocity: 500            # Maximum speed (max. 300)
max_accel: 10000              # Maximum acceleration (max. 4000)
max_z_velocity: 15           # Z-axis maximum speed
max_z_accel: 150            # Z-axis maximum acceleration
square_corner_velocity: 5.0  # Square corner speed

####################################################################
#Autotune configuration
####################################################################$#

[autotune_tmc stepper_x]
motor: omc-17hs19-2004s1
sgt:1
tuning_goal = performance
[autotune_tmc stepper_y]
motor: omc-17hs19-2004s1
sgt:1
tuning_goal = performance

[autotune_tmc stepper_z]
motor: omc-17hs19-2004s1
tuning_goal = auto
[autotune_tmc stepper_z1]
motor: omc-17hs19-2004s1
tuning_goal = auto
[autotune_tmc stepper_z2]
motor: omc-17hs19-2004s1
tuning_goal = auto
[autotune_tmc stepper_z3]
motor: omc-17hs19-2004s1
tuning_goal = auto

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg-9T
#####################################################################
#####################################################################
#   B(X) ---------A(Y)
#   |                |
#   |--------E-------|
#   |                |
#   |                |
#   |                |
#####################################################################
##                   X-axis on MOTOR_0(B Motor)
#####################################################################

[stepper_x]
step_pin: PF13             # X-axis motor pulse pin setting
dir_pin: PF12              # X-axis motor direction pin setting
enable_pin: !PF14          # X-axis motor enable pin setting
microsteps: 256             # Motor microsteps Setting
rotation_distance: 40      # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation:200   # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
endstop_pin: tmc2240_stepper_x:virtual_endstop # Sensorless homing endstop
position_min: 0            # X-axis minimum travel - software limit
position_endstop: 346  #350    ## Mechanical reset point coordinates for X-axis (change to 350 for 350 models)
position_max: 346 #350       ## X-axis maximum travel - software limit (change to 350 for 350 models)
homing_speed: 60          # Reset speed maximum 100
homing_retract_dist: 0     # Setback distance after the first trigger of the reset switch
homing_positive_dir: true  # Direction of reset (generally no change required)

[tmc2240 stepper_x]
cs_pin: PC4
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
diag0_pin: ^!PG6
driver_SGT: 2
driver_TPFD: 0
run_current: 0.9
interpolate: true

#####################################################################
##                   Y-axis on MOTOR_1(A Motor)
#####################################################################

[stepper_y]
step_pin: PG0              # Y-axis motor pulse pin setting
dir_pin: PG1               # Y-axis motor direction pin setting
enable_pin: !PF15          # Y-axis motor enable pin setting
microsteps: 256           # Motor microsteps Setting
rotation_distance: 40      # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation:200   # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
#endstop_pin: PG9           # Limit switch PIN pin setting（Y-
endstop_pin: tmc2240_stepper_y:virtual_endstop # Sensorless homing endstop
position_min: 0            # X-axis minimum travel - software limit
position_endstop: 340  #350      # Mechanical reset point coordinates for Y-axis (change to 350 for 350 models)
position_max: 340  #350          # Y-axis maximum travel - software limit (change to 350 for 350 models)
homing_speed: 60           # Reset speed maximum 100
homing_retract_dist: 0     # Setback distance after the first trigger of the reset switch
homing_positive_dir: true  # Direction of reset (generally no change required)

[tmc2240 stepper_y]
cs_pin: PD11
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
diag0_pin: ^!PG9
driver_SGT: 2
driver_TPFD: 0
run_current: 0.9
interpolate: true

####################################################################################
#   z1 -------------- z2
#   |                 |
#   |                 |
#   |                 |
#   |                 |
#  z0---   display ---z3
#####################################################################
##                  Z0-axis
#####################################################################
##		Z0-axis on MOTOR2_1(left front)
[stepper_z]
step_pin: PF11    		   # Z-axis motor pulse pin
dir_pin: PG3               # Z-axis motor direction pin setting
enable_pin: !PG5           # Z-axis motor enable pin setting
rotation_distance: 40      # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio: 80:16          # reduction ratio
microsteps: 64             # microsteps
endstop_pin: probe:z_virtual_endstop        # Limit switch interface
position_max: 340   #340       # Maximum Z-axis print height   350mm=340
position_min: -9           # Soft Limit Minimum Stroke
homing_speed: 20           # Reset speed - maximum 20
second_homing_speed: 3     # Secondary reset speed - maximum 10
homing_retract_dist: 0     # Retreat distance
#--------------------------------------------------------------------
[tmc2209 stepper_z]        # TMC2209
uart_pin: PC6              # drive communications port
interpolate: true          # Whether to enable 256 microstep interpolation
run_current: 0.8           # Motor running current value(mA)
hold_current: 0.8          # holding current(mA)
sense_resistor: 0.110      # Do not change the drive sampling resistor
stealthchop_threshold: 200 # Mute threshold

#--------------------------------------------------------------------#
##		Z1-axis on MOTOR3(left rear)
[stepper_z1]
step_pin: PG4              # Z1-axis motor pulse pin
dir_pin: !PC1              # Z1-axis motor direction pin setting
enable_pin: !PA0           # Z1-axis motor enable pin setting
rotation_distance: 40      # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio: 80:16          # reduction ratio
microsteps: 64             # microsteps
#--------------------------------------------------------------------
[tmc2209 stepper_z1]       # TMC2209
uart_pin: PC7              # drive communications port
interpolate: true          # Whether to enable 256 microstep interpolation
run_current: 0.8           # Motor running current value(mA)
hold_current: 0.8          # holding current(mA)
sense_resistor: 0.110      # Do not change the drive sampling resistor
stealthchop_threshold: 200 # Mute threshold

#--------------------------------------------------------------------#
##		Z2-axis on MOTOR4(right-rear)
[stepper_z2]
step_pin: PF9              # Z2-axis motor pulse pin
dir_pin: PF10              # Z2-axis motor direction pin setting
enable_pin: !PG2           # Z2-axis motor enable pin setting
rotation_distance: 40      # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio: 80:16          # reduction ratio
microsteps: 64             # microsteps
#--------------------------------------------------------------------
[tmc2209 stepper_z2]       # TMC2209
uart_pin: PF2              # drive communications port
interpolate: true          # Whether to enable 256 microstep interpolation
run_current: 0.8           # Motor running current value(mA)
hold_current: 0.8          # holding current(mA)
sense_resistor: 0.110      # Do not change the drive sampling resistor
stealthchop_threshold: 200 # Mute threshold

#--------------------------------------------------------------------#
##		Z3-axis on MOTOR5(right-front)
[stepper_z3]
step_pin: PC13             # Z3-axis motor pulse pin
dir_pin: !PF0              # Z3-axis motor direction pin setting
enable_pin: !PF1           # Z3-axis motor enable pin setting
rotation_distance: 40      # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio: 80:16          # reduction ratio
microsteps: 64             # microsteps
#--------------------------------------------------------------------
[tmc2209 stepper_z3]       # TMC2209
uart_pin: PE4              # drive communications port
interpolate: true          # Whether to enable 256 microstep interpolation
run_current: 0.8           # Motor running current value(mA)
hold_current: 0.8          # holding current(mA)
sense_resistor: 0.110      # Do not change the drive sampling resistor
stealthchop_threshold: 200 # Mute threshold


#####################################################################
##                  Heater_bed
#####################################################################

[heater_bed]
heater_pin: PA3              # (BE0)
sensor_pin: PF3              # sensor interface(TB)
sensor_type: ATC Semitec 104GT-2	 #ATC Semitec 104GT-2
#control: pid                 ##heater_bed Temperature PID Calibration Command:  "PID_CALIBRATE HEATER=heater_bed TARGET=100" 
min_temp: 0
max_temp: 120
max_power: 1.0

#####################################################################
##	                 Temperature Monitoring
#####################################################################
[temperature_sensor Octopus-MCU]        
sensor_type: temperature_mcu
max_temp: 100
[temperature_sensor BTT-PI]
sensor_type: temperature_host
max_temp: 100
[temperature_sensor Chamber]
sensor_type: PT1000
sensor_pin: PF5
pullup_resistor: 46450
#####################################################################
# 	                   Bed Grid Calibration
#####################################################################

[bed_mesh]
speed: 2500                   # Calibration speed
horizontal_move_z: 5        # Z-axis movement speed
mesh_min: 35,6             # Minimum calibration point coordinates x, y
mesh_max: 320,320         # Maximum calibration point coordinates x, y
probe_count: 6,6            # Number of sampling points (7X7 is 49 points)
#adaptive_margin: 3           #New param
#scan_overshoot: 8
split_delta_z: 0.025
#fade_start: 0
#fade_end: 2
mesh_pps: 3,3                # Number of supplementary sampling points
algorithm: lagrange           # algorithmic model
#relative_reference_index: 12 # Update when changing probe_count, to ((x points * y points) - 1) / 2. (the center point)  Examples: 3x3 mesh = 4 5x5 mesh = 12 7x7 mesh = 24
bicubic_tension: 0.2         # Algorithmic interpolation don't move
#fade_target: 0


