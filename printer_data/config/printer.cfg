[include mainsail.cfg]
[include ss_macro.cfg]
[include homing.cfg]
[include K-ShakeTune/*.cfg]
#[include hbb.cfg]
#[include KNOMI.cfg]
#[include Revotoolhead.cfg]
[include RapidToolhead.cfg]
[include klicky-probe.cfg]

[skew_correction]
[exclude_object]
[respond]
[gcode_arcs]
resolution: 1

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 3
show_macros_in_webui: True

#####################################################################
##                      MCU Octopus
#####################################################################
[mcu]
canbus_uuid: a593a1cd1a15    
canbus_interface: can0

#####################################################################
##                      Speed and acceleration
#####################################################################
[printer]
kinematics: corexy
max_velocity: 500
max_accel: 9000
max_z_velocity: 15
max_z_accel: 150
square_corner_velocity: 5.0

[resonance_tester]
accel_per_hz: 75
max_freq: 133
probe_points: 175, 175, 40
accel_chip: adxl345

[input_shaper]
shaper_type_x = mzv
shaper_freq_x = 53.0
shaper_type_y = mzv
shaper_freq_y = 40.4

#####################################################################
##                      Autotune configuration (Base)
#####################################################################
[autotune_tmc stepper_x]
motor: omc-17hs19-2004s1
sgt: 1
tuning_goal = performance

[autotune_tmc stepper_y]
motor: omc-17hs19-2004s1
sgt: 1
tuning_goal = performance

[autotune_tmc stepper_z]
motor: omc-17hs19-2004s1
tuning_goal = auto

[autotune_tmc stepper_z1]
motor: omc-17hs19-2004s1
tuning_goal = auto

[autotune_tmc stepper_z2]
motor: omc-17hs19-2004s1
tuning_goal = auto

[autotune_tmc stepper_z3]
motor: omc-17hs19-2004s1
tuning_goal = auto

#####################################################################
##                      X-axis on MOTOR_0
#####################################################################
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: 0
position_endstop: 355
position_max: 355
homing_speed: 60
homing_retract_dist: 0
homing_positive_dir: true

[tmc2240 stepper_x]
cs_pin: PC4
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
diag0_pin: ^!PG6
driver_SGT: 2
driver_TPFD: 0
run_current: 0.9
interpolate: true
stealthchop_threshold: 9999

#####################################################################
##                      Y-axis on MOTOR_1
#####################################################################
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 60
homing_retract_dist: 0
homing_positive_dir: true

[tmc2240 stepper_y]
cs_pin: PD11
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
diag0_pin: ^!PG9
driver_SGT: 2
driver_TPFD: 0
run_current: 0.9
interpolate: true
stealthchop_threshold: 9999

#####################################################################
##                      Z0-axis (MOTOR 2)
#####################################################################
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 340
position_min: -9
homing_speed: 20
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 200

#####################################################################
##                      Z1-axis (MOTOR 3)
#####################################################################
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 200

#####################################################################
##                      Z2-axis (MOTOR 4)
#####################################################################
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 200

#####################################################################
##                      Z3-axis (MOTOR 5)
#####################################################################
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 200

#####################################################################
##                      Heater bed
#####################################################################
[heater_bed]
heater_pin: PA3
sensor_pin: PF3
sensor_type: ATC Semitec 104GT-2
min_temp: 0
max_temp: 120
max_power: 1.0

#####################################################################
##                      Temperature Monitoring
#####################################################################
[temperature_sensor Octopus-MCU]        
sensor_type: temperature_mcu
max_temp: 100

[temperature_sensor BTT-PI]
sensor_type: temperature_host
max_temp: 100

#####################################################################
##                      Bed Mesh Calibration
#####################################################################
[bed_mesh]
speed: 2500
horizontal_move_z: 20
mesh_min: 35,6
mesh_max: 320,320
probe_count: 6,6
split_delta_z: 0.025
mesh_pps: 3,3
algorithm: lagrange
bicubic_tension: 0.2

#####################################################################
##                      Fans (Skirts & Electronics)
#####################################################################
[heater_fan controller_fan]
pin: PE5
max_power: 0.9
shutdown_speed: 0.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 50
fan_speed: 0.6

[heater_fan controller_fan2]
pin: PD12
max_power: 0.9
shutdown_speed: 0.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 50
fan_speed: 0.6

#####################################################################
##                      NEVERMORE
#####################################################################
[nevermore]
bt_address: 28:CD:C1:0B:27:4C
fan_power_passive: 0
fan_power_automatic: 1
fan_power_coefficient: 0.7
fan_policy_cooldown: 900
fan_policy_voc_passive_max: 200
fan_policy_voc_improve_min: 25
fan_thermal_limit_temperature_min: 50
fan_thermal_limit_temperature_max: 60
fan_thermal_limit_coefficient: 0
voc_gating_threshold: 240

[temperature_sensor nevermore_intake_VOC]
sensor_type: NevermoreSensor
sensor_kind: intake
plot_voc: true

#####################################################################
##                      Idle timeout
#####################################################################
[idle_timeout]
gcode:
  {% if printer.webhooks.state|lower == 'ready' %}
    {% if printer.pause_resume.is_paused|lower == 'false' %}
      TURN_OFF_HEATERS
      M84
    {% else %}
      M104 S0
    {% endif %}
  {% endif %}
timeout: 8800

#####################################################################
##                      Gantry levelling
#####################################################################
[quad_gantry_level]
gantry_corners:
	-60,-10
	410,420
points:
	50,25
	50,275
	300,275
    300,25
speed: 400
horizontal_move_z: 20
retries: 5
retry_tolerance: 0.01
max_adjust: 20

[board_pins]
aliases:
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

