
[include shell_command.cfg]
[include mainsail.cfg]
[include ss_macro.cfg]
[include homing.cfg]
[include K-ShakeTune/*.cfg]
[force_move]
enable_force_move: True
#####################################################################
## 	                MCU EBBCan
#####################################################################
[skew_correction]

[mcu EBBCan]
canbus_uuid: d446594edc03   
#  The following command is used to view the ID of canbus and needs to be entered in the ssh terminal.
# “ ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0 ”
#usb-katapult_stm32f446xx_530021000751313133353932-if00

#--------------------------------------------------------------
[adxl345]
cs_pin: EBBCan:gpio1
spi_software_sclk_pin: EBBCan:gpio2
spi_software_mosi_pin: EBBCan:gpio0
spi_software_miso_pin: EBBCan:gpio3
axes_map: z,-y,x

[resonance_tester]
probe_points: 175, 175, 20
accel_chip: adxl345

#####################################################################
#   BTT Smart Filament Sensor 2.0
#####################################################################

[filament_switch_sensor switch_sensor]
switch_pin: ^PG12
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
insert_gcode:
  M117 Filament switch inserted

[filament_motion_sensor filament_sensor]
switch_pin: ^PG13
detection_length: 25
extruder: extruder
pause_on_runout: False
event_delay: 3.0
pause_delay: 1.0 #0.5
runout_gcode:
  M117 Runout Detected!
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament encoder runout
insert_gcode:
  M117 Filament encoder inserted

