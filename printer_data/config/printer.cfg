#####################################################################
#                            RGB-LEDlight
#####################################################################

[neopixel LEDlight]
pin: PB10                     # signal interface
chain_count: 25            # Number of lamp beads
color_order: GRB             # colour sequence
initial_RED: 0.2             # Initial red brightness
initial_GREEN: 0.2           # Initial green brightness
initial_BLUE: 0.2            # Initial blue brightness

#####################################################################
#                          Idle off hot bed
#####################################################################

# [idle_timeout]
# timeout: 8800                # The hot bed is switched off if the idle time exceeds 30 minutes
[idle_timeout]
gcode:
  {% if printer.webhooks.state|lower == 'ready' %}
    {% if printer.pause_resume.is_paused|lower == 'false' %}
      TURN_OFF_HEATERS
      M84
    {% else %}
      #Set Extruder off
      M104 S0
    {% endif %}
  {% endif %}
# 10 minute timeout
timeout: 600

####################################################################################
#	                         Gantry levelling 
####################################################################################
[quad_gantry_level]
gantry_corners:
 	-60,-10
 	410,420
##  Probe points
points:
 	30,30
 	30,310
 	310,310
    310,30
speed: 600                          # Levelling speed
horizontal_move_z: 10                # Z-axis starting height
retries: 3                          # Number of out-of-tolerance retries
retry_tolerance: 0.07               # Sampling tolerance
max_adjust: 20                      # Maximum adjustment stroke for levelling



[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,       # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,         # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5


