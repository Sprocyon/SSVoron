#####################################################################
#  SSVoron — основний конфіг Klipper
#
#  CoreXY 350 x 350 x 340
#    * Octopus (STM32F446, CAN) — X/Y/Z, стіл, вентилятори
#    * X/Y — TMC2240, безконтактний (sensorless) хомінг
#    * Z   — 4 x TMC2209, гвинт 80:16, Z-ендстоп = щуп Klicky
#
#  Голова, екструдер, ADXL345, щуп Klicky і весь хомінг Z —
#  у файлі RapidToolhead.cfg (єдиний інший файл конфігурації).
#
#  Стіл рівний, тому bed_mesh свідомо НЕ використовується:
#  ні [bed_mesh], ні збереженого профілю, ні BED_MESH_* у макросах.
#####################################################################

[include RapidToolhead.cfg]

#####################################################################
#  Базові модулі
#####################################################################
[respond]
[exclude_object]
[skew_correction]
[display_status]
[pause_resume]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[gcode_arcs]
resolution: 1

# Потрібен для SET_KINEMATIC_POSITION, який використовують макроси Klicky
[force_move]
enable_force_move: True

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 6
show_macros_in_webui: True

#####################################################################
#  MCU Octopus (основна плата)
#####################################################################
[mcu]
canbus_uuid: a593a1cd1a15
canbus_interface: can0

#####################################################################
#  Кінематика та обмеження
#####################################################################
[printer]
kinematics: corexy
max_velocity: 500
max_accel: 9000
max_z_velocity: 15
max_z_accel: 150
square_corner_velocity: 5.0

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 54.6
damping_ratio_x: 0.088
shaper_type_y: mzv
shaper_freq_y: 42.2
damping_ratio_y: 0.074

[resonance_tester]
accel_chip: adxl345
probe_points: 175, 175, 40
accel_per_hz: 75
max_freq: 133

#####################################################################
#  Автопідбір струмів TMC (autotune_tmc)
#####################################################################
[autotune_tmc stepper_x]
motor: omc-17hs19-2004s1
sgt: 1
tuning_goal: performance

[autotune_tmc stepper_y]
motor: omc-17hs19-2004s1
sgt: 1
tuning_goal: performance

[autotune_tmc stepper_z]
motor: omc-17hs19-2004s1
tuning_goal: auto

[autotune_tmc stepper_z1]
motor: omc-17hs19-2004s1
tuning_goal: auto

[autotune_tmc stepper_z2]
motor: omc-17hs19-2004s1
tuning_goal: auto

[autotune_tmc stepper_z3]
motor: omc-17hs19-2004s1
tuning_goal: auto

#####################################################################
#  X — MOTOR_0, sensorless (StallGuard)
#####################################################################
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: 0
position_endstop: 355
position_max: 355
homing_speed: 60
homing_retract_dist: 0
homing_positive_dir: true

[tmc2240 stepper_x]
cs_pin: PC4
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
diag0_pin: ^!PG6
run_current: 1.2
interpolate: true

#####################################################################
#  Y — MOTOR_1, sensorless (StallGuard)
#####################################################################
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 60
homing_retract_dist: 0
homing_positive_dir: true

[tmc2240 stepper_y]
cs_pin: PD11
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
diag0_pin: ^!PG9
run_current: 1.2
interpolate: true

#####################################################################
#  Z0 — MOTOR_2 (ведучий, ендстоп = щуп Klicky)
#####################################################################
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 340
# -1 замість -9: сопло не може опуститися на 9 мм у стіл,
# хомінгу це не заважає — він іде до спрацювання щупа.
position_min: -1
homing_speed: 10
second_homing_speed: 3
# 5 мм відкату = другий, повільніший прохід → точніший Z
homing_retract_dist: 5

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.8
hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 200

#####################################################################
#  Z1 — MOTOR_3
#####################################################################
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.8
hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 200

#####################################################################
#  Z2 — MOTOR_4
#####################################################################
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.8
hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 200

#####################################################################
#  Z3 — MOTOR_5
#####################################################################
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.8
hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 200

#####################################################################
#  Стіл
#####################################################################
[heater_bed]
heater_pin: PA3
sensor_pin: PF3
sensor_type: ATC Semitec 104GT-2
min_temp: 0
max_temp: 120
max_power: 1.0

#####################################################################
#  Контроль температури плат
#####################################################################
[temperature_sensor Octopus-MCU]
sensor_type: temperature_mcu
max_temp: 100

[temperature_sensor BTT-PI]
sensor_type: temperature_host
max_temp: 100

#####################################################################
#  Вентилятори корпусу (запускаються разом зі столом)
#####################################################################
[heater_fan controller_fan]
pin: PE5
max_power: 0.9
shutdown_speed: 0.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 50
fan_speed: 0.6

[heater_fan controller_fan2]
pin: PD12
max_power: 0.9
shutdown_speed: 0.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 50
fan_speed: 0.6

# Малий фільтр Nevermore (керується макросами Nevermore_on / Nevermore_off)
[fan_generic Small_Nevermore]
pin: PA8

#####################################################################
#  Nevermore (VOC-сенсор по Bluetooth)
#####################################################################
[nevermore]
bt_address: 28:CD:C1:0B:27:4C
fan_power_passive: 0
fan_power_automatic: 1
fan_power_coefficient: 0.7
fan_policy_cooldown: 900
fan_policy_voc_passive_max: 200
fan_policy_voc_improve_min: 25
fan_thermal_limit_temperature_min: 50
fan_thermal_limit_temperature_max: 60
fan_thermal_limit_coefficient: 0
voc_gating_threshold: 240

[temperature_sensor nevermore_intake_VOC]
sensor_type: NevermoreSensor
sensor_kind: intake
plot_voc: true

[output_pin fan5_light]
# Вкажіть номер контакту Fan5 на Octopus Pro, зазвичай це PD15
pin: PD15
# Встановіть максимальну потужність 1.0 (повна потужність)
#max_power: 1.0
# Початковий стан 0 (вимкнено)
value: 0
# Увімкніть апаратний ШІМ для плавного регулювання яскравості (необов'язково)
#hardware_pwm: True



#####################################################################
#  Idle timeout
#  M84 тут навмисно НЕ викликається: інакше Z-портик падає під
#  власною вагою після 2.5 годин простою.
#####################################################################
[idle_timeout]
timeout: 8800
gcode:
    {% if printer.webhooks.state|lower == 'ready' %}
        {% if printer.pause_resume.is_paused|lower == 'false' %}
            TURN_OFF_HEATERS
        {% else %}
            M104 S0
        {% endif %}
    {% endif %}

#####################################################################
#  Вирівнювання порталу (4 мотори Z)
#####################################################################
[quad_gantry_level]
gantry_corners:
    -60,-10
    410,420
points:
    50,25
    50,275
    300,275
    300,25
speed: 400
horizontal_move_z: 20
retries: 5
retry_tolerance: 0.02
# Запобіжник від аварії щупа. 15 мм — щоб перший прогін міг виправити
# сильно перекошений портал (зараз ~9.5 мм); після вирівнювання
# реальні корекції будуть у межах десятих.
max_adjust: 15

#####################################################################
#  Псевдоніми роз'ємів плати
#####################################################################
[board_pins]
aliases:
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

#####################################################################
#
#                            М А К Р О С И
#
#####################################################################

#####################################################################
#  Хомінг
#####################################################################

# G28 лише для тих осей, які ще не відхомовані
[gcode_macro CG28]
description: Хомінг лише невідхомованих осей
gcode:
    {% set home_axes = "" %}
    {% if "x" not in printer.toolhead.homed_axes and "y" not in printer.toolhead.homed_axes %}
        {% set home_axes = home_axes + "X Y" %}
    {% elif "x" not in printer.toolhead.homed_axes %}
        {% set home_axes = home_axes + "X" %}
    {% elif "y" not in printer.toolhead.homed_axes %}
        {% set home_axes = home_axes + "Y" %}
    {% endif %}
    {% if "z" not in printer.toolhead.homed_axes %}
        {% set home_axes = home_axes + " Z" %}
    {% endif %}
    {% if home_axes != "" %}
        G28 {home_axes}
    {% endif %}

# Повний цикл: хомінг + вирівнювання порталу
[gcode_macro G32]
description: Хомінг усіх осей + QUAD_GANTRY_LEVEL
gcode:
    G28
    QUAD_GANTRY_LEVEL

#####################################################################
#  Друк: старт / кінець
#####################################################################

# PRINT_START BED_TEMP=100 EXTRUDER_TEMP=240 SOAK=10
[gcode_macro PRINT_START]
description: Підготовка до друку
gcode:
    {% set BED = params.BED_TEMP|default(60)|int %}
    {% set EXTRUDER = params.EXTRUDER_TEMP|default(200)|int %}
    {% set SOAK = params.SOAK|default(0)|int %}

    # Корекція скосу зі збереженого профілю (SAVE_CONFIG)
    SKEW_PROFILE LOAD=calilantern_skew_profile

    # Підсвітка голови на час підготовки
    SET_LED LED=Toolhead1_rgb RED=1 GREEN=1 BLUE=1 TRANSMIT=1

    # Сопло гріється до 150 °C, поки гріється стіл
    M104 S150
    M190 S{BED}

    {% if SOAK > 0 %}
        RESPOND MSG="Термостабілізація {SOAK} хв"
        G4 P{SOAK * 60000}
    {% endif %}

	# Перед хомінгом перевіряємо, чи щуп не на голові
    _CheckProbe action=query
    {% if printer["gcode_macro _Probe_Variables"].probe_attached %}
        Dock_Probe
    {% endif %}
    # Хомінг + вирівнювання порталу (щуп сам стає в док)
    G32

    # Паркування і очікування робочої температури сопла
    LOGO_RED
    G1 X100 Y15 Z50 F12000
    M109 S{EXTRUDER}

    _PURGE_LINE

[gcode_macro PRINT_END]
description: Завершення друку
gcode:
    M400

    # Відкат тільки якщо сопло гаряче
    {% if printer.extruder.temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
        G92 E0
        G1 E-2 F2000
    {% endif %}
	M83                 ; Відносна екструзія
    G1 E-2 F3000        ; Ретракт 5 мм
    M82                 ; Повертаємо абсолютну
    
	# Підйом на 10 мм, але не вище Z max
    {% set z_up = [printer.toolhead.position.z + 10, printer.toolhead.axis_maximum.z]|min %}
    G90
    G1 Z{z_up} F3000
    M400

    TURN_OFF_HEATERS
    M107
    G0 X175 Y335 F15000

	M83                 ; Відносна екструзія
    G1 E-5 F1800        ; Ретракт 5 мм
    M82                 ; Повертаємо абсолютну

    # Знімаємо корекцію скосу — її завантажить наступний PRINT_START
    SET_SKEW CLEAR=1

    SET_LED LED=Toolhead1_rgb RED=0 GREEN=0 BLUE=0 TRANSMIT=1

    # Фільтр доопрацьовує ще 5 хвилин після друку
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=300

# Охолодження столу після друку (30 хв зі столом 60 °C, далі 30 хв без нагріву)
[gcode_macro PRINT_COOLING]
description: Поступове охолодження після друку
gcode:
    M190 S60
    _WAIT TIME=1800
    TURN_OFF_HEATERS
    _WAIT TIME=1800
    Nevermore_off
    DISPLAYTEXT TEXT="Cooling complete"

# Заміна філаменту
[gcode_macro M600]
description: Заміна філаменту (пауза)
gcode:
    PAUSE

#####################################################################
#  Пауза / продовження / скасування
#####################################################################

[gcode_macro PAUSE]
description: Пауза з підйомом Z і паркуванням
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(10)|int %}

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}
        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE

        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
            G91
            G1 Z{z} F2000
        {% else %}
            { action_respond_info("Підйом на паузі перевищує максимальну Z") }
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90

        G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_minimum.y + 5} F6000
        SAVE_GCODE_STATE NAME=PAUSEPARK
        M104 S0
        SET_IDLE_TIMEOUT TIMEOUT=43200
    {% endif %}

[gcode_macro RESUME]
description: Продовження друку після паузи
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # E=0 за замовчуванням: сопло вже прогріте і не має видавлювати зайве
    {% set e = params.E|default(0)|float %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

        {% if etemp > 0 %}
            M109 S{etemp|int}
        {% endif %}

        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100

        G91
        M83
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900
        {% else %}
            G1 Z{zhop * -1} F900
        {% endif %}

        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60
        BASE_RESUME
    {% endif %}

[gcode_macro CANCEL_PRINT]
description: Скасування друку з паркуванням
rename_existing: BASE_CANCEL_PRINT
gcode:
    M400
    G92 E0
    TURN_OFF_HEATERS
    M107
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    CLEAR_PAUSE
    SDCARD_RESET_FILE

    {% if 'xyz' in printer.toolhead.homed_axes %}
        {% set z_up = [printer.toolhead.position.z + 10, printer.toolhead.axis_maximum.z]|min %}
        G90
        G1 Z{z_up} F3000
        G1 X175 Y300 F12000
    {% endif %}

    SET_SKEW CLEAR=1
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=300

#####################################################################
#  Температура сопла і продувка
#####################################################################

# M109 з м'якшим допуском, ніж штатний: не чекаємо повної
# стабілізації, тому старт друку швидший (допуск -1.5 °C).
#   M109 S240        — нагріти до 240 і чекати
#   M109 R240        — тільки чекати (ціль не змінюється)
#   M109 S240 R200   — нагріти до 240, чекати 200
[gcode_macro M109]
description: Нагрів сопла з допуском 1.5 °C
rename_existing: M109.1
gcode:
    {% set S = params.S|default(0)|float %}
    {% set R = params.R|default(S)|float %}

    {% if params.S is defined %}
        M104 S{S}
    {% endif %}
    {% if R > 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={R - 1.5}
    {% endif %}

# Продувна лінія перед друком (спереду, X100 → X160)
[gcode_macro _PURGE_LINE]
description: Продувна лінія перед друком
gcode:
    SAVE_GCODE_STATE NAME=Pre_Prime

    G90                 ; абсолютне позиціонування
    M82                 ; абсолютна екструзія
    G92 E0              ; скидання координати E

    G1 Z10 F3000        ; безпечна висота
    G1 X100 Y5 F12000   ; старт біля переднього краю
    G1 Z0.3 F5000       ; висота першого шару

    # Перша лінія
    G1 X160 Y5 Z0.35 F1000 E12

    # Зсув по Y і зворотна лінія
    G1 X160 Y5.4 Z0.3 F5000
    G1 X100 Y5.4 Z0.3 F1500 E24

    # --- ФІНАЛ: Ретракт та підйом без зайвих рухів по X/Y ---
    #M83                 ; ТИМЧАСОВО переходимо на відносну екструзію
    #G1 E-1.0 F1800      ; Ретракт 1 мм (F1800 = 30 мм/с, щоб не смикати філамент)
    #M82                 ; Повертаємо абсолютну екструзію (як було)
    
    #G1 Z2.0 F3000       ; Підйом сопла на 2 мм, щоб не зачепити лінію

    # Якщо треба, щоб голова ВЗАГАЛІ не рухалася далі, 
    # змініть MOVE=1 на MOVE=0
    RESTORE_GCODE_STATE NAME=Pre_Prime MOVE=0 MOVE_SPEED=200

#####################################################################
#  Філамент
#####################################################################

[gcode_macro LOAD_FILAMENT]
description: Завантаження філаменту
variable_load_distance: 40         # мм — до екструдера
variable_purge_distance: 50        # мм — продувка після завантаження
variable_nozzle_preheat_temp: 220  # °C — температура за замовчуванням
variable_turn_off_extruder: True   # вимикати сопло після операції
gcode:
    {% set load_speed = params.LOAD_SPEED|default(600)|int %}
    {% set purge_speed = params.PURGE_SPEED|default(300)|int %}
    {% set target_temp = params.TARGET_TEMP|default(nozzle_preheat_temp)|int %}
    {% set min_temp = params.MIN_TEMP|default(180)|int %}

    SAVE_GCODE_STATE NAME=load_state

    {% if target_temp >= min_temp %}
        M104 S{target_temp}
        M109 S{target_temp}
    {% else %}
        M104 S{min_temp}
        M109 S{min_temp}
    {% endif %}

    G91
    G92 E0
    G1 E{load_distance} F{load_speed}
    G1 E{purge_distance} F{purge_speed}

    {% if turn_off_extruder %}
        M104 S0
    {% endif %}

    G90
    RESTORE_GCODE_STATE NAME=load_state

    M117 Filament load complete

[gcode_macro UNLOAD_FILAMENT]
description: Вивантаження філаменту
variable_unload_distance: 100      # мм — відкат з екструдера
variable_nozzle_preheat_temp: 180  # °C — температура за замовчуванням
variable_turn_off_extruder: True   # вимикати сопло після операції
gcode:
    {% set retract_speed = params.RETRACT_SPEED|default(600)|int %}
    {% set target_temp = params.TARGET_TEMP|default(nozzle_preheat_temp)|int %}
    {% set min_temp = params.MIN_TEMP|default(180)|int %}

    SAVE_GCODE_STATE NAME=unload_state

    {% if printer.extruder.temperature < target_temp %}
        {% if target_temp >= min_temp %}
            M104 S{target_temp}
            M109 S{target_temp}
        {% else %}
            M104 S{min_temp}
            M109 S{min_temp}
        {% endif %}
    {% endif %}

    G91
    G92 E0
    G1 E-{unload_distance} F{retract_speed}

    {% if turn_off_extruder %}
        M104 S0
    {% endif %}

    G90
    RESTORE_GCODE_STATE NAME=unload_state

    M117 Filament unload complete

#####################################################################
#  Фільтр Nevermore
#####################################################################

[gcode_macro Nevermore_on]
description: Увімкнути малий фільтр
gcode:
    SET_FAN_SPEED FAN=Small_Nevermore SPEED=1

[gcode_macro Nevermore_off]
description: Вимкнути малий фільтр
gcode:
    SET_FAN_SPEED FAN=Small_Nevermore SPEED=0

[gcode_macro TOGGLE_Small_NEVERMORE]
description: Перемкнути малий фільтр
gcode:
    {% if printer['fan_generic Small_Nevermore'].speed > 0 %}
        SET_FAN_SPEED FAN=Small_Nevermore SPEED=0
    {% else %}
        SET_FAN_SPEED FAN=Small_Nevermore SPEED=1
    {% endif %}

# Викликається з PRINT_END / CANCEL_PRINT через UPDATE_DELAYED_GCODE
[delayed_gcode filter_off]
gcode:
    SET_FAN_SPEED FAN=Small_Nevermore SPEED=0

#####################################################################
#  Світлодіоди голови
#####################################################################

[gcode_macro LOGO_RED]
description: Логотип голови червоним
gcode:
    SET_LED LED=Toolhead1_rgb RED=1.0 GREEN=0.0 BLUE=0.0 INDEX=1 TRANSMIT=1

[gcode_macro LOGO_OFF]
description: Вимкнути логотип голови
gcode:
    SET_LED LED=Toolhead1_rgb RED=0.0 GREEN=0.0 BLUE=0.0 INDEX=1 TRANSMIT=1

[gcode_macro LED_ON]
description: Біле світло голови (усі діоди)
gcode:
    SET_LED LED=Toolhead1_rgb RED=1 GREEN=1 BLUE=1

#####################################################################
#  Сервісні макроси
#####################################################################

[gcode_macro SHUTDOWN]
description: Вимкнути нагрів, вентилятори та живлення хоста
gcode:
    TURN_OFF_HEATERS
    M107
    Nevermore_off
    M84
    {action_call_remote_method("shutdown_machine")}

[gcode_macro _WAIT]
description: Пауза в секундах
gcode:
    {% set TIME = params.TIME|default(0)|int %}
    G4 P{TIME * 1000}

[gcode_macro DISPLAYTEXT]
description: Вивести текст у консоль і на дисплей
gcode:
    {% set TEXT = params.TEXT|default("")|string %}
    RESPOND MSG="{TEXT}"
    M117 {TEXT}

[gcode_macro update_git]
description: Резервна копія конфігурації в git
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh $0"
timeout: 90.0
verbose: True

[gcode_macro PARK]
gcode:
    {% if printer["gcode_macro _Probe_Variables"].probe_attached %}
        Dock_Probe
    {% endif %}
    G0 X175 Y335 F15000

