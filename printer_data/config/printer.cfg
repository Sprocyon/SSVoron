fade_end: 10.0
mesh_pps: 2,2                # Number of supplementary sampling points
algorithm: bicubic           # algorithmic model
# relative_reference_index: 12 # Update when changing probe_count, to ((x points * y points) - 1) / 2. (the center point)  Examples: 3x3 mesh = 4 5x5 mesh = 12 7x7 mesh = 24
bicubic_tension: 0.2         # Algorithmic interpolation don't move



