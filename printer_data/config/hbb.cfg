[mcu HBB]
serial: /dev/serial/by-id/usb-Klipper_rp2040_454741505A87581A-if00

[include variables.cfg]
[gcode_macro LED_COLOR]
gcode:
 SET_LED LED=HBB_LED RED=0.2 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0 #Extrude
 SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0 #Stop
 SET_LED LED=HBB_LED RED=1 GREEN=1 BLUE=0 INDEX=3 TRANSMIT=0 #Pause Resume
 SET_LED LED=HBB_LED RED=0 GREEN=1 BLUE=0.2157 INDEX=4 TRANSMIT=0 #Home
 SET_LED LED=HBB_LED RED=0.4039 GREEN=0.1294 BLUE=1 INDEX=5 TRANSMIT=0 #ZNozzle_UP
 SET_LED LED=HBB_LED RED=1 GREEN=1 BLUE=1 INDEX=6 TRANSMIT=0 #Led light
 SET_LED LED=HBB_LED RED=1 GREEN=0.1647 BLUE=0 INDEX=7 TRANSMIT=1 #Preheat bad


[save_variables]
filename: ~/variables.cfg  # Зберігає стан між перезавантаженнями

#----------------MACROS-------------------------------
[gcode_macro TOGGLE_RGB]
variable_is_led_on: 1
gcode:
    {% if printer["gcode_macro TOGGLE_RGB"].is_led_on == 0 %}
        # Увімкнути основне освітлення
        SET_LED LED=Toolhead1_rgb RED=1 GREEN=1 BLUE=1
        SET_LED LED=HBB_LED RED=1 GREEN=1 BLUE=1

        # Встановити кольори для кнопок
        SET_LED LED=HBB_LED RED=0.2 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0  # Extrude
        SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0    # Stop
        SET_LED LED=HBB_LED RED=1 GREEN=1 BLUE=0 INDEX=3 TRANSMIT=0    # Pause Resume
        SET_LED LED=HBB_LED RED=0 GREEN=1 BLUE=0.2157 INDEX=4 TRANSMIT=0  # Home
        SET_LED LED=HBB_LED RED=0.4039 GREEN=0.1294 BLUE=1 INDEX=5 TRANSMIT=0  # ZNozzle_UP
        SET_LED LED=HBB_LED RED=1 GREEN=1 BLUE=1 INDEX=6 TRANSMIT=0    # Led light
        SET_LED LED=HBB_LED RED=1 GREEN=0.1647 BLUE=0 INDEX=7 TRANSMIT=1  # Preheat bed

        SET_GCODE_VARIABLE MACRO=TOGGLE_RGB VARIABLE=is_led_on VALUE=1
    {% else %}
        # Вимкнути основне освітлення
        SET_LED LED=Toolhead1_rgb RED=0 GREEN=0 BLUE=0
        SET_LED LED=HBB_LED RED=0 GREEN=0 BLUE=0

        SET_GCODE_VARIABLE MACRO=TOGGLE_RGB VARIABLE=is_led_on VALUE=0
    {% endif %}

[gcode_macro HEAT_BED_WITH_INDICATOR]
gcode:
     # Встановити початковий синій колір кнопки (поки стіл холодний)
    SET_LED LED=HBB_LED RED=0 GREEN=0 BLUE=1 INDEX=7 TRANSMIT=1
    
    # Встановлюємо температуру столу на 70 градусів і починаємо нагрів
    M140 S70       # Установити цільову температуру столу
    M190 S70       # Очікувати, доки стіл нагріється до 70 градусів
    
    # Змінити колір кнопки на червоний після досягнення 70 градусів
    SET_LED LED=HBB_LED RED=1 GREEN=0.1647 BLUE=0 INDEX=7 TRANSMIT=1

[gcode_macro TOGGLE_PAUSE]
gcode:
    # Перевіряємо поточний стан змінної
    {% if pause_resume_status == 'paused' %}
        # Якщо стан 'paused', продовжуємо друк
        RESUME  ; Продовжити друк
        # Змінюємо колір кнопки на жовтий (Pause Resume)
        SET_LED LED=HBB_LED RED=1 GREEN=1 BLUE=0 INDEX=3 TRANSMIT=0
        # Оновлюємо стан на 'printing'
        SET_VARIABLE pause_resume_status value='printing'
    {% else %}
        # Якщо стан не 'paused', ставимо на паузу
        PAUSE  ; Поставити на паузу
        # Змінюємо колір кнопки на червоний (Stop)
        SET_LED LED=HBB_LED RED=1 GREEN=0.1647 BLUE=0 INDEX=3 TRANSMIT=0
        # Оновлюємо стан на 'paused'
        SET_VARIABLE pause_resume_status value='paused'
    {% endif %}

[gcode_macro EXTRUDE_FILAMENT]
gcode:
   # Включення підсвітки на білий колір
    SET_LED LED=HBB_LED RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=1  # Білий колір
   # Нагрівання сопла до 220 градусів
    M104 S220  # Set nozzle temperature to 220°C
    M109 S220  # Wait until the nozzle reaches 220°C

    # Видавлювання 50мм філаменту зі швидкістю 5 мм/с
    G1 E50 F300  # Extrude 50mm of filament at 5mm/s
    # Вимкнення нагріву сопла
    M104 S0  ; Вимкнути нагрів сопла
    # Після завершення екструзії, встановлюємо підсвітку назад на початковий колір
    SET_LED LED=HBB_LED RED=0.2 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=1  # Початковий колір

[gcode_macro LIFT_NOZZLE]
gcode:
    G1 Z50 F300  ; Підняти сопло на 50 мм зі швидкістю 300 мм/хв

#---------------------------KEY-------------------------------------
[gcode_button key1] #Extrude
pin: HBB: gpio25
press_gcode:
 LED_COLOR
release_gcode:     
  EXTRUDE_FILAMENT
  #SET_LED LED=HBB_LED RED=255 GREEN=136 BLUE=0 INDEX=1  #TRANSMIT=0

[gcode_button key2] #Stop
pin: HBB: gpio26
press_gcode:
release_gcode:     
  CANCEL_PRINT
  SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=2  

[gcode_button key3] #Pause Resume
pin: HBB: gpio27
press_gcode:
release_gcode:     
  TOGGLE_PAUSE
  #SET_LED LED=HBB_LED RED=0 GREEN=0 BLUE=1 INDEX=3 

[gcode_button key4] #Home
pin: HBB: gpio19
press_gcode:
release_gcode:     
  G28
  SET_LED LED=HBB_LED RED=0 GREEN=1 BLUE=0 INDEX=4 

[gcode_button key5] #Z Nozzle UP
pin: HBB: gpio18
press_gcode:
release_gcode:     
  LIFT_NOZZLE
  #SET_LED LED=HBB_LED RED=0 GREEN=0 BLUE=1 INDEX=5 

[gcode_button key6] #Led light
pin: HBB: gpio13
press_gcode:
release_gcode:
  TOGGLE_RGB
  #SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=6 

[gcode_button key7] #Preheat bad
pin: HBB: gpio12
press_gcode:
release_gcode:
  HEAT_BED_WITH_INDICATOR
  #SET_LED LED=HBB_LED RED=1 GREEN=0 BLUE=0 INDEX=7 

[neopixel HBB_LED]
pin: HBB: gpio20
chain_count: 7
color_order: GRB
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0
