[resonance_tester]
probe_points: 175, 175, 20
accel_chip: adxl345

[input_shaper]
shaper_type_x = 3hump_ei
shaper_freq_x = 71,4
shaper_type_y = ei
shaper_freq_y = 44,8

# [gcode_macro T1]
