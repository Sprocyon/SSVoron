###################
# Quad Gantry Level
[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
description: Conform a moving, twistable gantry to the shape of a stationary bed with klicky automount
gcode:
    {% set V = printer["gcode_macro _User_Variables"].verbose %}
    {% if V %}
        { action_respond_info("QG Level") }
    {% endif %}

    _CheckProbe action=query
    G90
    
    # 1. Беремо пробу один раз
    attach_probe
    _KLICKY_STATUS_LEVELING

    # 2. Вирівнюємо портал (проба вже на голові)
    _QUAD_GANTRY_LEVEL {% for p in params
            %}{'%s=%s ' % (p, params[p])}{%
            endfor %}

    # 3. Викликаємо повторний G28 Z. 
    # Завдяки тому, що проба вже на голові, Klicky просто зробить повторний замір Z!
    G28 Z

    # 4. Віддаємо пробу в док у самому кінці
    dock_probe